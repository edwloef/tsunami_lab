name: Tsunami Lab
on: [push, pull_request]
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install scons valgrind cppcheck nlohmann-json3-dev libnetcdf-dev
          git submodule update --init --recursive
          curl -Lo middle_states.csv https://scalable.uni-jena.de/assets/tsunami_lab/middle_states.csv
          curl -Lo artificialtsunami_bathymetry_1000.nc https://scalable.uni-jena.de/assets/tsunami_lab/artificialtsunami_bathymetry_1000.nc
          curl -Lo artificialtsunami_displ_1000.nc https://scalable.uni-jena.de/assets/tsunami_lab/artificialtsunami_displ_1000.nc
#         sudo apt-get install gmt
#         curl -Lo GEBCO_2026_sub_ice.zip https://dap.ceda.ac.uk/bodc/gebco/global/gebco_2026/sub_ice_topography_bathymetry/netcdf/GEBCO_2026_sub_ice.zip
#         unzip GEBCO_2026_sub_ice.zip
#         gmt project -C141.024949/37.316569 -E146.0/37.316569 -G250e -Q | gmt grdtrack -GGEBCO_2026_sub_ice.nc | awk 'BEGIN {print "lon,lat,distance_m,elevation_m"} {print $1","$2","$3","$4}' > GEBCO_2026_sub_ice_bathy.csv

      - name: cppcheck
        run: cppcheck src/ --template=gcc --force --error-exitcode=1

      - name: sanitize
        run: |
          scons mode=debug+san
          ./build/tests
          ./build/tsunami_lab -d artificialtsunami_displ_1000.nc -b artificialtsunami_bathymetry_1000.nc -s 10 -l 25
          scons mode=release+san
          ./build/tests
          ./build/tsunami_lab -d artificialtsunami_displ_1000.nc -b artificialtsunami_bathymetry_1000.nc -s 5 -l 25

      - name: valgrind
        run: |
          scons mode=debug
          valgrind ./build/tests
          valgrind ./build/tsunami_lab -d artificialtsunami_displ_1000.nc -b artificialtsunami_bathymetry_1000.nc -s 10 -l 25
          scons mode=release
          valgrind ./build/tests
          valgrind ./build/tsunami_lab -d artificialtsunami_displ_1000.nc -b artificialtsunami_bathymetry_1000.nc -s 5 -l 25
